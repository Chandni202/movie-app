<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Movie Hub MHD</title>

<meta name="theme-color" content="#050505">

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    background:#050505;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    overflow-x:hidden;
}

button,input{
    font:inherit;
}

button{
    cursor:pointer;
}

::-webkit-scrollbar{
    width:4px;
    height:4px;
}

::-webkit-scrollbar-thumb{
    background:#444;
    border-radius:20px;
}

/* HEADER */

.header{
    position:sticky;
    top:0;
    z-index:1000;
    height:62px;
    display:flex;
    align-items:center;
    padding:0 16px;
    background:rgba(5,5,5,.96);
    border-bottom:1px solid #1d1d1d;
}

.logo{
    font-size:22px;
    font-weight:900;
    letter-spacing:1.5px;
    white-space:nowrap;
}

.logo span{
    color:#e50914;
}

/* SEARCH */

.search-area{
    padding:13px 16px 8px;
    background:#050505;
}

.search-box{
    width:78%;
    max-width:620px;
    margin:auto;
    position:relative;
}

.search-box input{
    width:100%;
    height:45px;
    border-radius:25px;
    border:1px solid #333;
    background:#171717;
    color:white;
    padding:0 48px 0 18px;
    outline:none;
    font-size:15px;
}

.search-box input:focus{
    border-color:#777;
}

.search-icon{
    position:absolute;
    right:17px;
    top:50%;
    transform:translateY(-50%);
    font-size:19px;
}

/* MAIN */

main{
    padding-bottom:80px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

/* HERO */

.hero{
    height:320px;
    margin-top:7px;
    position:relative;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(to bottom,transparent 45%,#050505 100%),
        linear-gradient(to right,#050505 0%,transparent 25%,transparent 75%,#050505 100%);
    z-index:10;
}

.hero-track{
    height:100%;
    position:relative;
}

.hero-card{
    position:absolute;
    top:15px;
    left:50%;
    width:190px;
    height:275px;
    transform:translateX(-50%) scale(.72);
    opacity:0;
    border-radius:12px;
    overflow:hidden;
    transition:
        transform .55s ease,
        opacity .55s ease,
        filter .55s ease;
    box-shadow:0 15px 45px rgba(0,0,0,.75);
    background:#151515;
}

.hero-card img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.hero-card::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to top,rgba(0,0,0,.65),transparent 55%);
}

.hero-card.center{
    transform:translateX(-50%) scale(1);
    opacity:1;
    z-index:5;
}

.hero-card.left{
    transform:translateX(-115%) scale(.78);
    opacity:.58;
    z-index:3;
}

.hero-card.right{
    transform:translateX(15%) scale(.78);
    opacity:.58;
    z-index:3;
}

.hero-card.far-left{
    transform:translateX(-165%) scale(.62);
    opacity:.25;
    z-index:2;
}

.hero-card.far-right{
    transform:translateX(65%) scale(.62);
    opacity:.25;
    z-index:2;
}

.hero-title{
    position:absolute;
    z-index:20;
    bottom:18px;
    left:20px;
    right:20px;
    text-align:center;
    font-size:19px;
    font-weight:800;
    text-shadow:0 3px 10px #000;
}

/* SECTIONS */

.section{
    margin-top:20px;
}

.section-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px 10px;
}

.section-title{
    font-size:19px;
    font-weight:800;
}

.see-all{
    color:#aaa;
    font-size:12px;
}

.movie-row{
    display:flex;
    gap:11px;
    overflow-x:auto;
    padding:0 15px 7px;
}

.movie-card{
    flex:0 0 130px;
    cursor:pointer;
}

.poster{
    width:130px;
    height:190px;
    border-radius:8px;
    overflow:hidden;
    background:#161616;
    position:relative;
}

.poster img{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
}

.rating{
    position:absolute;
    left:6px;
    bottom:6px;
    padding:3px 6px;
    border-radius:5px;
    background:rgba(0,0,0,.85);
    color:#ffd700;
    font-size:11px;
    font-weight:bold;
}

.movie-name{
    margin-top:7px;
    font-size:13px;
    line-height:17px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.movie-year{
    color:#888;
    font-size:11px;
    margin-top:2px;
}

/* LOADING */

.loading{
    padding:30px 20px;
    text-align:center;
    color:#aaa;
}

.spinner{
    width:30px;
    height:30px;
    border:3px solid #333;
    border-top-color:#e50914;
    border-radius:50%;
    animation:spin .8s linear infinite;
    margin:0 auto 10px;
}

@keyframes spin{
    to{transform:rotate(360deg);}
}

/* ERROR */

.error-box{
    margin:20px 15px;
    padding:18px;
    border-radius:10px;
    background:#171717;
    border:1px solid #522;
    text-align:center;
    color:#ddd;
}

.error-box strong{
    color:#ff4040;
}

.retry-btn{
    margin-top:12px;
    background:#e50914;
    border:0;
    color:white;
    padding:10px 20px;
    border-radius:7px;
}

/* SEARCH PAGE */

.search-results{
    padding:15px;
}

.search-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:14px 9px;
}

.search-grid .movie-card{
    width:100%;
}

.search-grid .poster{
    width:100%;
    height:auto;
    aspect-ratio:2/3;
}

/* FAVORITES */

.empty{
    text-align:center;
    padding:60px 20px;
    color:#777;
}

/* BOTTOM NAV */

.bottom-nav{
    position:fixed;
    z-index:2000;
    left:0;
    right:0;
    bottom:0;
    height:64px;
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:rgba(8,8,8,.97);
    border-top:1px solid #222;
}

.nav-btn{
    border:0;
    background:none;
    color:#777;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:4px;
    font-size:11px;
}

.nav-btn span{
    font-size:20px;
}

.nav-btn.active{
    color:#fff;
}

.nav-btn.active span{
    color:#e50914;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    z-index:5000;
    inset:0;
    background:rgba(0,0,0,.94);
    overflow-y:auto;
}

.modal.show{
    display:block;
}

.modal-close{
    position:fixed;
    z-index:5100;
    top:12px;
    right:15px;
    width:40px;
    height:40px;
    border-radius:50%;
    border:1px solid #555;
    background:rgba(0,0,0,.75);
    color:#fff;
    font-size:23px;
}

.details{
    max-width:850px;
    margin:auto;
    padding-bottom:50px;
}

.details-backdrop{
    height:230px;
    position:relative;
    overflow:hidden;
    background:#111;
}

.details-backdrop img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:.5;
    filter:blur(1px);
}

.details-backdrop::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(to bottom,transparent 10%,#050505 100%);
}

.details-main{
    display:flex;
    gap:15px;
    padding:0 17px;
    margin-top:-90px;
    position:relative;
    z-index:5;
}

.details-poster{
    width:145px;
    height:218px;
    flex-shrink:0;
    border-radius:9px;
    overflow:hidden;
    background:#151515;
}

.details-poster img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.details-info{
    padding-top:65px;
}

.details-title{
    font-size:23px;
    font-weight:900;
    line-height:28px;
}

.details-meta{
    color:#aaa;
    font-size:12px;
    margin-top:7px;
}

.details-rating{
    color:#ffd700;
    font-weight:bold;
    margin-top:10px;
}

.details-actions{
    display:flex;
    gap:8px;
    margin-top:12px;
    flex-wrap:wrap;
}

.action-btn{
    border:0;
    border-radius:7px;
    padding:9px 12px;
    font-size:12px;
    font-weight:bold;
}

.watch-btn{
    background:#e50914;
    color:white;
}

.fav-btn{
    background:#292929;
    color:white;
}

.details-content{
    padding:20px 17px;
}

.detail-heading{
    font-size:17px;
    font-weight:800;
    margin:20px 0 9px;
}

.overview{
    color:#ccc;
    font-size:14px;
    line-height:22px;
}

.provider{
    padding:13px;
    border-radius:8px;
    background:#171717;
    color:#ddd;
    font-size:13px;
}

.provider a{
    color:#fff;
    text-decoration:none;
}

.review{
    padding:13px;
    background:#151515;
    border-radius:8px;
    margin-bottom:10px;
}

.review-author{
    color:#fff;
    font-weight:bold;
    font-size:13px;
    margin-bottom:7px;
}

.review-text{
    color:#aaa;
    font-size:12px;
    line-height:18px;
}

/* TMDB */

.tmdb-note{
    color:#666;
    font-size:10px;
    text-align:center;
    padding:25px 15px 90px;
    line-height:16px;
}

/* DESKTOP */

@media(min-width:700px){

    .header{
        padding:0 30px;
    }

    .search-area{
        padding-top:18px;
    }

    .hero{
        height:420px;
    }

    .hero-card{
        width:245px;
        height:355px;
    }

    .movie-card{
        flex-basis:155px;
    }

    .poster{
        width:155px;
        height:225px;
    }

    .search-grid{
        grid-template-columns:repeat(6,1fr);
    }

    .bottom-nav{
        left:50%;
        transform:translateX(-50%);
        width:600px;
        border:1px solid #222;
        border-radius:15px 15px 0 0;
    }
}
</style>
</head>

<body>

<header class="header">
    <div class="logo">MOVIE <span>HUB</span> <small>MHD</small></div>
</header>

<div class="search-area">
    <div class="search-box">
        <input
            id="searchInput"
            type="search"
            placeholder="Search movies..."
            autocomplete="off">
        <div class="search-icon">⌕</div>
    </div>
</div>

<main>

<!-- HOME -->

<section id="homePage" class="page active">

    <div id="homeLoading" class="loading">
        <div class="spinner"></div>
        Loading Movie Hub...
    </div>

    <div id="homeContent" style="display:none;">

        <section class="hero">
            <div id="heroTrack" class="hero-track"></div>
            <div id="heroTitle" class="hero-title"></div>
        </section>

        <div id="homeSections"></div>

        <div class="tmdb-note">
            This product uses the TMDB API but is not endorsed or certified by TMDB.
        </div>

    </div>

    <div id="homeError"></div>

</section>


<!-- SEARCH -->

<section id="searchPage" class="page">

    <div class="section-header">
        <div class="section-title">Search Results</div>
    </div>

    <div id="searchLoading" class="loading" style="display:none;">
        <div class="spinner"></div>
        Searching...
    </div>

    <div id="searchResults" class="search-results"></div>

</section>


<!-- TRENDING -->

<section id="trendingPage" class="page">

    <div class="section-header">
        <div class="section-title">🔥 Trending Movies</div>
    </div>

    <div id="trendingContent"></div>

</section>


<!-- FAVORITES -->

<section id="favoritesPage" class="page">

    <div class="section-header">
        <div class="section-title">❤️ Your Favorites</div>
    </div>

    <div id="favoritesContent" class="search-results"></div>

</section>

</main>


<!-- BOTTOM NAV -->

<nav class="bottom-nav">

    <button class="nav-btn active" data-page="homePage">
        <span>⌂</span>
        Home
    </button>

    <button class="nav-btn" data-page="searchPage">
        <span>⌕</span>
        Search
    </button>

    <button class="nav-btn" data-page="trendingPage">
        <span>🔥</span>
        Trending
    </button>

    <button class="nav-btn" data-page="favoritesPage">
        <span>♥</span>
        Favorites
    </button>

</nav>


<!-- DETAILS MODAL -->

<div id="detailsModal" class="modal">

    <button class="modal-close" onclick="closeDetails()">×</button>

    <div id="detailsContent" class="details"></div>

</div>


<script>

/* =====================================================
   1. PUT YOUR TMDB V3 API KEY HERE
   ===================================================== */

const API_KEY = "b28b49facbe85228205dcbec20a1c8a1";


/* =====================================================
   2. BASIC SETTINGS
   ===================================================== */

const IMAGE = "https://image.tmdb.org/t/p/w500";
const BACKDROP = "https://image.tmdb.org/t/p/w1280";

let heroMovies = [];
let heroIndex = 0;
let heroTimer = null;

let favorites = JSON.parse(
    localStorage.getItem("MHD_FAVORITES") || "[]"
);


/* =====================================================
   3. ELEMENTS
   ===================================================== */

const homeLoading = document.getElementById("homeLoading");
const homeContent = document.getElementById("homeContent");
const homeError = document.getElementById("homeError");
const heroTrack = document.getElementById("heroTrack");
const heroTitle = document.getElementById("heroTitle");
const homeSections = document.getElementById("homeSections");


/* =====================================================
   4. API FUNCTION
   ===================================================== */

async function api(url){

    if(
        !API_KEY ||
        API_KEY === "YOUR_TMDB_API_KEY" ||
        API_KEY.includes("PASTE")
    ){
        throw new Error(
            "TMDB API Key বসানো হয়নি। index.html-এর API_KEY জায়গায় তোমার TMDB V3 API Key বসাও।"
        );
    }

    const separator = url.includes("?") ? "&" : "?";

    const finalURL =
        "https://api.themoviedb.org/3" +
        url +
        separator +
        "api_key=" +
        encodeURIComponent(API_KEY) +
        "&language=en-US";

    const controller = new AbortController();

    const timer = setTimeout(
        () => controller.abort(),
        15000
    );

    try{

        const response = await fetch(
            finalURL,
            {
                signal:controller.signal
            }
        );

        if(!response.ok){

            let message =
                "TMDB API error: " + response.status;

            try{
                const errorData = await response.json();

                if(errorData.status_message){
                    message = errorData.status_message;
                }

            }catch(e){}

            throw new Error(message);
        }

        return await response.json();

    }finally{

        clearTimeout(timer);

    }
}


/* =====================================================
   5. MOVIE CARD
   ===================================================== */

function movieCard(movie){

    if(!movie){
        return "";
    }

    const poster =
        movie.poster_path
        ? IMAGE + movie.poster_path
        : "";

    const title =
        movie.title ||
        movie.name ||
        "Unknown Movie";

    const rating =
        Number(movie.vote_average || 0).toFixed(1);

    const year =
        movie.release_date
        ? movie.release_date.substring(0,4)
        : "";

    if(!poster){

        return `
        <div class="movie-card"
             onclick="openDetails(${movie.id})">

            <div class="poster">
                <div style="
                    width:100%;
                    height:100%;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    color:#777;
                    font-size:12px;
                    padding:10px;
                    text-align:center;
                ">
                    No Poster
                </div>

                <div class="rating">★ ${rating}</div>
            </div>

            <div class="movie-name">${escapeHTML(title)}</div>

            <div class="movie-year">${year}</div>

        </div>
        `;
    }

    return `
    <div class="movie-card"
         onclick="openDetails(${movie.id})">

        <div class="poster">

            <img
                src="${poster}"
                alt="${escapeHTML(title)}"
                loading="lazy"
                onerror="this.style.display='none'">

            <div class="rating">
                ★ ${rating}
            </div>

        </div>

        <div class="movie-name">
            ${escapeHTML(title)}
        </div>

        <div class="movie-year">
            ${year}
        </div>

    </div>
    `;
}


/* =====================================================
   6. ESCAPE TEXT
   ===================================================== */

function escapeHTML(text){

    return String(text || "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =====================================================
   7. SECTION
   ===================================================== */

function createSection(title, movies){

    if(!movies || !movies.length){
        return "";
    }

    return `
    <section class="section">

        <div class="section-header">

            <div class="section-title">
                ${escapeHTML(title)}
            </div>

            <div class="see-all">
                Swipe →
            </div>

        </div>

        <div class="movie-row">

            ${movies
                .slice(0,15)
                .map(movieCard)
                .join("")}

        </div>

    </section>
    `;
}


/* =====================================================
   8. HOME DATA
   ===================================================== */

async function loadHome(){

    homeLoading.style.display = "block";
    homeContent.style.display = "none";
    homeError.innerHTML = "";

    try{

        const [
            trending,
            hollywood,
            bollywood,
            bengali,
            telugu,
            tamil,
            malayalam,
            kannada,
            indian,
            indianTop,
            hollywoodTop
        ] = await Promise.all([

            api("/trending/movie/day"),

            api(
                "/discover/movie" +
                "?with_origin_country=US" +
                "&sort_by=popularity.desc" +
                "&vote_count.gte=50" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=hi" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=bn" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=te" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=ta" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=ml" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_original_language=kn" +
                "&with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_origin_country=IN" +
                "&sort_by=popularity.desc" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "?with_origin_country=IN" +
                "&sort_by=vote_average.desc" +
                "&vote_count.gte=300" +
                "&page=1"
            ),

            api(
                "/discover/movie" +
                "
