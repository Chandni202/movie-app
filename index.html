<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>MOVIE HUB MHD</title>

<meta name="theme-color" content="#050505">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

::-webkit-scrollbar{
width:4px;
height:4px;
}

::-webkit-scrollbar-thumb{
background:#444;
border-radius:10px;
}

/* HEADER */

.header{
height:60px;
position:sticky;
top:0;
z-index:1000;
display:flex;
align-items:center;
padding:0 16px;
background:rgba(5,5,5,.96);
backdrop-filter:blur(15px);
border-bottom:1px solid #1c1c1c;
}

.logo{
font-size:21px;
font-weight:900;
letter-spacing:1px;
}

.logo b{
color:#e50914;
}

.logo small{
font-size:9px;
color:#888;
margin-left:4px;
letter-spacing:2px;
}

/* SEARCH */

.search-wrap{
padding:12px 15px 7px;
background:#050505;
}

.search{
width:76%;
max-width:650px;
margin:auto;
position:relative;
}

.search input{
width:100%;
height:44px;
background:#171717;
border:1px solid #303030;
border-radius:25px;
outline:none;
color:white;
padding:0 45px 0 18px;
font-size:14px;
transition:.3s;
}

.search input:focus{
border-color:#777;
box-shadow:0 0 15px rgba(255,255,255,.05);
}

.search-icon{
position:absolute;
right:17px;
top:11px;
font-size:20px;
color:#aaa;
}

/* PAGES */

.page{
display:none;
}

.page.active{
display:block;
}

main{
padding-bottom:78px;
}

/* HERO */

.hero{
height:325px;
position:relative;
overflow:hidden;
margin-top:5px;
}

.hero-bg{
position:absolute;
inset:0;
background-position:center;
background-size:cover;
filter:blur(16px);
opacity:.22;
transform:scale(1.15);
transition:background-image .5s;
}

.hero-bg::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,rgba(5,5,5,.1),#050505 95%);
}

.hero-stage{
position:absolute;
inset:0;
}

.hero-card{
position:absolute;
left:50%;
top:17px;
width:175px;
height:260px;
border-radius:11px;
overflow:hidden;
background:#151515;
box-shadow:0 15px 45px #000;
opacity:0;
transform:translateX(-50%) scale(.65);
transition:
transform .55s cubic-bezier(.2,.8,.2,1),
opacity .55s ease,
filter .55s ease;
}

.hero-card img{
width:100%;
height:100%;
object-fit:cover;
}

.hero-card.center{
opacity:1;
transform:translateX(-50%) scale(1);
z-index:6;
}

.hero-card.left{
opacity:.65;
transform:translateX(-112%) scale(.77);
z-index:4;
}

.hero-card.right{
opacity:.65;
transform:translateX(12%) scale(.77);
z-index:4;
}

.hero-card.farleft{
opacity:.3;
transform:translateX(-160%) scale(.6);
z-index:2;
}

.hero-card.farright{
opacity:.3;
transform:translateX(60%) scale(.6);
z-index:2;
}

.hero-bottom{
position:absolute;
z-index:20;
bottom:17px;
left:15px;
right:15px;
text-align:center;
text-shadow:0 3px 12px #000;
}

.hero-title{
font-size:20px;
font-weight:900;
}

.hero-sub{
font-size:11px;
color:#aaa;
margin-top:4px;
}

/* SECTION */

.section{
margin-top:20px;
}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px 9px;
}

.section-title{
font-size:18px;
font-weight:800;
}

.section-more{
font-size:11px;
color:#888;
}

.row{
display:flex;
gap:10px;
overflow-x:auto;
padding:0 15px 7px;
scrollbar-width:none;
}

.row::-webkit-scrollbar{
display:none;
}

/* MOVIE CARD */

.card{
flex:0 0 128px;
cursor:pointer;
transition:transform .25s;
}

.card:active{
transform:scale(.95);
}

.poster{
width:128px;
height:190px;
border-radius:8px;
overflow:hidden;
position:relative;
background:#141414;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.poster-rating{
position:absolute;
left:6px;
bottom:6px;
background:rgba(0,0,0,.85);
padding:3px 6px;
border-radius:4px;
font-size:10px;
font-weight:bold;
color:#ffd700;
}

.card-title{
font-size:12px;
font-weight:600;
margin-top:6px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.card-year{
font-size:10px;
color:#777;
margin-top:2px;
}

/* GRID */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px 9px;
padding:15px;
}

.grid .card{
width:100%;
}

.grid .poster{
width:100%;
height:auto;
aspect-ratio:2/3;
}

/* LOADING */

.loader{
padding:45px 20px;
text-align:center;
color:#aaa;
}

.spin{
width:32px;
height:32px;
border:3px solid #292929;
border-top-color:#e50914;
border-radius:50%;
animation:rotate .7s linear infinite;
margin:auto auto 12px;
}

@keyframes rotate{
to{
transform:rotate(360deg);
}
}

/* ERROR */

.error{
margin:20px 15px;
padding:20px;
background:#151515;
border:1px solid #422;
border-radius:10px;
text-align:center;
color:#bbb;
}

.error strong{
color:#ff4545;
}

.retry{
margin-top:14px;
padding:9px 18px;
background:#e50914;
border:0;
border-radius:6px;
color:white;
font-weight:bold;
}

/* EMPTY */

.empty{
padding:65px 20px;
text-align:center;
color:#777;
}

/* BOTTOM NAV */

.bottom{
position:fixed;
z-index:3000;
bottom:0;
left:0;
right:0;
height:65px;
background:rgba(8,8,8,.97);
backdrop-filter:blur(15px);
border-top:1px solid #222;
display:flex;
justify-content:space-around;
align-items:center;
}

.nav{
background:none;
border:0;
color:#777;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

.nav span{
font-size:20px;
}

.nav.active{
color:white;
}

.nav.active span{
color:#e50914;
}

/* DETAILS */

.modal{
position:fixed;
z-index:5000;
inset:0;
background:#050505;
display:none;
overflow-y:auto;
}

.modal.open{
display:block;
animation:fadein .25s ease;
}

@keyframes fadein{
from{
opacity:0;
}
to{
opacity:1;
}
}

.close{
position:fixed;
z-index:6000;
right:13px;
top:12px;
width:40px;
height:40px;
border:1px solid #555;
border-radius:50%;
background:rgba(0,0,0,.7);
color:white;
font-size:23px;
}

.detail-backdrop{
height:250px;
position:relative;
overflow:hidden;
}

.detail-backdrop img{
width:100%;
height:100%;
object-fit:cover;
opacity:.48;
filter:blur(1px);
}

.detail-backdrop::after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,transparent 25%,#050505 100%);
}

.detail-main{
position:relative;
z-index:10;
display:flex;
gap:14px;
padding:0 16px;
margin-top:-100px;
}

.detail-poster{
width:145px;
height:218px;
border-radius:9px;
overflow:hidden;
background:#151515;
flex-shrink:0;
box-shadow:0 10px 30px #000;
}

.detail-poster img{
width:100%;
height:100%;
object-fit:cover;
}

.detail-info{
padding-top:66px;
}

.detail-title{
font-size:22px;
font-weight:900;
line-height:27px;
}

.detail-meta{
font-size:11px;
color:#aaa;
margin-top:7px;
line-height:17px;
}

.detail-rating{
margin-top:9px;
font-size:13px;
font-weight:bold;
color:#ffd700;
}

.actions{
display:flex;
gap:7px;
flex-wrap:wrap;
margin-top:12px;
}

.action{
border:0;
border-radius:6px;
padding:8px 11px;
font-size:11px;
font-weight:bold;
}

.watch{
background:#e50914;
color:white;
}

.favorite{
background:#292929;
color:white;
}

.detail-body{
padding:20px 16px 90px;
}

.heading{
font-size:17px;
font-weight:800;
margin:19px 0 9px;
}

.overview{
font-size:13px;
line-height:21px;
color:#ccc;
}

.info-box{
background:#151515;
border-radius:8px;
padding:14px;
font-size:12px;
line-height:20px;
color:#bbb;
}

.info-box strong{
color:white;
}

.review{
background:#151515;
border-radius:8px;
padding:13px;
margin-bottom:9px;
}

.review-author{
font-size:12px;
font-weight:bold;
margin-bottom:7px;
}

.review-text{
font-size:11px;
line-height:18px;
color:#aaa;
}

.watch-link{
display:inline-block;
margin-top:10px;
padding:9px 13px;
background:#e50914;
color:white;
text-decoration:none;
border-radius:6px;
font-size:11px;
font-weight:bold;
}

/* TMDB */

.tmdb{
text-align:center;
color:#666;
font-size:9px;
line-height:15px;
padding:20px 15px;
}

/* TOAST */

.toast{
position:fixed;
z-index:10000;
left:50%;
bottom:82px;
transform:translateX(-50%) translateY(20px);
background:#222;
color:white;
padding:10px 15px;
border-radius:7px;
font-size:12px;
opacity:0;
pointer-events:none;
transition:.3s;
}

.toast.show{
opacity:1;
transform:translateX(-50%) translateY(0);
}

/* DESKTOP */

@media(min-width:700px){

.header{
padding:0 30px;
}

.hero{
height:430px;
}

.hero-card{
width:245px;
height:360px;
}

.card{
flex-basis:155px;
}

.poster{
width:155px;
height:225px;
}

.grid{
grid-template-columns:repeat(6,1fr);
}

.bottom{
width:600px;
left:50%;
right:auto;
transform:translateX(-50%);
border-radius:15px 15px 0 0;
}

}

</style>
</head>

<script>


/* =====================================================
   TMDB API KEY
   ===================================================== */

const API_KEY = "b28b49facbe85228205dcbec20a1c8a1";


/* =====================================================
   SETTINGS
   ===================================================== */

const API = "https://api.themoviedb.org/3";

const IMG = "https://image.tmdb.org/t/p/w500";

const BG = "https://image.tmdb.org/t/p/w1280";

let heroMovies = [];

let heroIndex = 0;

let heroTimer = null;

let favorites =
JSON.parse(
localStorage.getItem("MHD_FAVORITES") || "[]"
);


/* =====================================================
   API REQUEST
   ===================================================== */

async function request(endpoint){

if(
!API_KEY ||
API_KEY === "b28b49facbe85228205dcbec20a1c8a1";
){

throw new Error(
"TMDB API Key বসানো হয়নি। API_KEY-এর জায়গায় তোমার V3 API Key বসাও।"
);

}


const separator =
endpoint.includes("?")
? "&"
: "?";


const url =
API +
endpoint +
separator +
"api_key=" +
encodeURIComponent(API_KEY);


const controller =
new AbortController();


const timeout =
setTimeout(
()=>controller.abort(),
15000
);


try{

const response =
await fetch(
url,
{
signal:controller.signal
}
);


if(!response.ok){

let msg =
"TMDB error " +
response.status;

try{

const json =
await response.json();

if(json.status_message){
msg =
json.status_message;
}

}catch(e){}

throw new Error(msg);

}


return await response.json();


}catch(error){

if(error.name === "AbortError"){

throw new Error(
"TMDB response নিতে বেশি সময় লাগছে। আবার Retry করো।"
);

}

throw error;


}finally{

clearTimeout(timeout);

}

}


/* =====================================================
   HTML SAFE
   ===================================================== */

function safe(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MOVIE CARD
   ===================================================== */

function card(movie){

if(!movie) return "";

const title =
movie.title ||
movie.original_title ||
"Unknown";

const poster =
movie.poster_path
? IMG + movie.poster_path
: "";

const rating =
Number(movie.vote_average || 0)
.toFixed(1);

const year =
movie.release_date
? movie.release_date.slice(0,4)
: "";


return `

<div class="card"
onclick="openMovie(${movie.id})">

<div class="poster">

${
poster
?
`<img
src="${poster}"
alt="${safe(title)}"
loading="lazy"
onerror="this.style.display='none'">`
:
`<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#777;
font-size:11px;">
No Poster
</div>`
}

<div class="poster-rating">
★ ${rating}
</div>

</div>

<div class="card-title">
${safe(title)}
</div>

<div class="card-year">
${year}
</div>

</div>

`;

}


/* =====================================================
   SECTION
   ===================================================== */

function section(title,movies){

if(
!movies ||
!movies.length
){
return "";
}


return `

<section class="section">

<div class="section-head">

<div class="section-title">
${safe(title)}
</div>

<div class="section-more">
Swipe →
</div>

</div>

<div class="row">

${movies
.slice(0,18)
.map(card)
.join("")}

</div>

</section>

`;

}


/* =====================================================
   LOAD HOME
   ===================================================== */

async function loadHome(){

const loader =
document.getElementById("homeLoader");

const data =
document.getElementById("homeData");

const error =
document.getElementById("homeError");


loader.style.display="block";

data.style.display="none";

error.innerHTML="";


try{


const results =
await Promise.allSettled([


/* TRENDING */

request(
"/trending/movie/day"
),


/* HOLLYWOOD */

request(
"/discover/movie" +
"?with_origin_country=US" +
"&sort_by=popularity.desc" +
"&vote_count.gte=30" +
"&page=1"
),


/* BOLLYWOOD */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=hi" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* BENGALI */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=bn" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TELUGU */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=te" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TAMIL */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=ta" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* MALAYALAM */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=ml" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* KANNADA */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=kn" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* INDIAN */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TOP INDIAN */

request(
"/discover/movie" +
"?with_origin_country=IN" +
"&sort_by=vote_average.desc" +
"&vote_count.gte=100" +
"&page=1"
),


/* TOP HOLLYWOOD */

request(
"/discover/movie" +
"?with_origin_country=US" +
"&sort_by=vote_average.desc" +
"&vote_count.gte=300" +
"&page=1"
)


]);


function get(i){

if(
results[i].status === "fulfilled"
){
return results[i].value.results || [];
}

return [];

}


const trending = get(0);

const hollywood = get(1);

const bollywood = get(2);

const bengali = get(3);

const telugu = get(4);

const tamil = get(5);

const malayalam = get(6);

const kannada = get(7);

const indian = get(8);

const indianTop = get(9);

const hollywoodTop = get(10);


/* HERO */

heroMovies =
trending
.filter(m=>m.poster_path)
.slice(0,12);


renderHero();


/* SECTIONS */

document.getElementById("sections").innerHTML =

section(
"🔥 Trending Movies",
trending
)

+

section(
"🎬 Hollywood Trending Movies",
hollywood
)

+

section(
"🇮🇳 Bollywood Trending Movies",
bollywood
)

+

section(
"🟢 Bengali Movies",
bengali
)

+

section(
"🎞️ Telugu / Tollywood",
telugu
)

+

section(
"🎥 Tamil Movies",
tamil
)

+

section(
"🎬 Malayalam Movies",
malayalam
)

+

section(
"🎬 Kannada Movies",
kannada
)

+

section(
"🇮🇳 Indian Today's Trending",
indian
)

+

section(
"⭐ Top Rated Indian Movies",
indianTop
)

+

section(
"⭐ Top Rated Hollywood Movies",
hollywoodTop
);


/* CHECK WHETHER AT LEAST ONE API WORKED */

if(
!trending.length &&
!hollywood.length &&
!indian.length
){

throw new Error(
"TMDB থেকে কোনো movie data পাওয়া যায়নি। API Key এবং GitHub Pages deployment check করো।"
);

}


loader.style.display="none";

data.style.display="block";


startHero();


}catch(error){

loader.style.display="none";

data.style.display="none";


error.innerHTML = `

<div class="error">

<strong>Movie Hub load হয়নি</strong>

<br><br>

${safe(error.message)}

<br><br>

<button
class="retry"
onclick="loadHome()">
Retry
</button>

</div>

`;

}

}


/* =====================================================
   HERO
   ===================================================== */

function heroPosition(index){

const total =
heroMovies.length;


if(index === heroIndex)
return "center";


if(
index ===
(heroIndex-1+total)%total
)
return "left";


if(
index ===
(heroIndex+1)%total
)
return "right";


if(
index ===
(heroIndex-2+total)%total
)
return "farleft";


if(

)

function renderHero(){

const stage =
document.getElementById("heroStage");

const bg =
document.getElementById("heroBG");

const title =
document.getElementById("heroTitle");


if(!heroMovies.length){

stage.innerHTML="";

title.textContent="";

return;

}


const movie =
heroMovies[heroIndex];


if(movie.backdrop_path){

bg.style.backgroundImage =
`url("${BG+movie.backdrop_path}")`;

}else{

bg.style.backgroundImage =
`url("${IMG+movie.poster_path}")`;

}


title.textContent =
movie.title || movie.original_title;


stage.innerHTML =

heroMovies
.map((movie,index)=>`

<div
class="hero-card ${heroPosition(index)}"
onclick="openMovie(${movie.id})">

<img
src="${IMG+movie.poster_path}"
alt="${safe(movie.title)}">

</div>

`)
.join("");


}


function nextHero(){

if(!heroMovies.length)
return;


heroIndex =
(heroIndex+1) %
heroMovies.length;


renderHero();

}


function startHero(){

clearInterval(heroTimer);


if(heroMovies.length>1){

heroTimer =
setInterval(
nextHero,
3000
);

}

}

   ===================================================== */

document.querySelectorAll(".nav")
.forEach(button=>{

button.onclick=()=>{

showPage(
button.dataset.page
);

};

});


function showPage(id){

document.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});


document
.getElementById(id)
.classList.add("active");


document.querySelectorAll(".nav")
.forEach(nav=>{

nav.classList.toggle(
"active",
nav.dataset.page === id
);

});


window.scrollTo({
top:0,
behavior:"smooth"
});


if(id === "trendingPage"){
loadTrending();
}


if(id === "favoritesPage"){
renderFavorites();
}

}
