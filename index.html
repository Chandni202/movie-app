<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<title>Movie Hub MHD</title>

<meta name="theme-color" content="#050505">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#050505;
color:#fff;
font-family:Arial,Helvetica,sans-serif;
overflow-x:hidden;
}

button,input{
font-family:inherit;
}

button{
cursor:pointer;
}

::-webkit-scrollbar{
width:4px;
height:4px;
}

::-webkit-scrollbar-thumb{
background:#444;
border-radius:20px;
}


/* ================= HEADER ================= */

.header{
height:62px;
display:flex;
align-items:center;
padding:0 16px;
position:sticky;
top:0;
z-index:1000;
background:rgba(5,5,5,.96);
backdrop-filter:blur(18px);
border-bottom:1px solid #1b1b1b;
}

.logo{
font-size:22px;
font-weight:900;
letter-spacing:1.4px;
}

.logo span{
color:#e50914;
}

.logo small{
font-size:9px;
color:#777;
letter-spacing:2px;
margin-left:4px;
}


/* ================= SEARCH ================= */

.search-area{
padding:12px 15px 7px;
background:#050505;
}

.search-box{
width:78%;
max-width:650px;
margin:auto;
position:relative;
}

.search-box input{
width:100%;
height:45px;
border-radius:25px;
border:1px solid #303030;
background:#171717;
color:#fff;
outline:none;
padding:0 48px 0 18px;
font-size:14px;
}

.search-box input:focus{
border-color:#666;
box-shadow:0 0 18px rgba(255,255,255,.04);
}

.search-icon{
position:absolute;
right:17px;
top:11px;
font-size:20px;
color:#aaa;
}


/* ================= PAGE ================= */

main{
padding-bottom:78px;
}

.page{
display:none;
}

.page.active{
display:block;
}


/* ================= HERO ================= */

.hero{
height:330px;
position:relative;
overflow:hidden;
margin-top:5px;
}

.hero-background{
position:absolute;
inset:-25px;
background-position:center;
background-size:cover;
filter:blur(18px);
opacity:.22;
transform:scale(1.1);
transition:background-image .5s ease;
}

.hero-background:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,transparent 25%,#050505 96%),
linear-gradient(to right,#050505 0%,transparent 30%,transparent 70%,#050505 100%);
}

.hero-stage{
position:absolute;
inset:0;
}

.hero-card{
position:absolute;
left:50%;
top:17px;
width:180px;
height:268px;
border-radius:12px;
overflow:hidden;
background:#151515;
box-shadow:0 18px 50px rgba(0,0,0,.85);

opacity:0;

transform:
translateX(-50%)
scale(.62);

transition:
transform .6s cubic-bezier(.2,.8,.2,1),
opacity .6s ease;
}

.hero-card img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.hero-card.center{
opacity:1;
z-index:10;

transform:
translateX(-50%)
scale(1);
}

.hero-card.left{
opacity:.62;
z-index:6;

transform:
translateX(-116%)
scale(.77);
}

.hero-card.right{
opacity:.62;
z-index:6;

transform:
translateX(16%)
scale(.77);
}

.hero-card.far-left{
opacity:.28;
z-index:3;

transform:
translateX(-165%)
scale(.60);
}

.hero-card.far-right{
opacity:.28;
z-index:3;

transform:
translateX(65%)
scale(.60);
}

.hero-info{
position:absolute;
z-index:20;
bottom:16px;
left:15px;
right:15px;
text-align:center;
text-shadow:0 3px 15px #000;
}

.hero-title{
font-size:20px;
font-weight:900;
}

.hero-meta{
font-size:11px;
color:#aaa;
margin-top:5px;
}


/* ================= SECTIONS ================= */

.section{
margin-top:21px;
}

.section-header{
display:flex;
align-items:center;
justify-content:space-between;
padding:0 15px 10px;
}

.section-title{
font-size:18px;
font-weight:800;
}

.section-more{
font-size:10px;
color:#777;
}

.movie-row{
display:flex;
gap:10px;
overflow-x:auto;
padding:0 15px 8px;
scrollbar-width:none;
}

.movie-row::-webkit-scrollbar{
display:none;
}


/* ================= MOVIE CARD ================= */

.movie-card{
flex:0 0 130px;
cursor:pointer;
transition:transform .2s;
}

.movie-card:active{
transform:scale(.94);
}

.poster{
width:130px;
height:192px;
border-radius:8px;
overflow:hidden;
position:relative;
background:#151515;
}

.poster img{
width:100%;
height:100%;
object-fit:cover;
display:block;
}

.rating{
position:absolute;
left:6px;
bottom:6px;
background:rgba(0,0,0,.85);
color:#ffd700;
padding:3px 6px;
border-radius:4px;
font-size:10px;
font-weight:bold;
}

.movie-name{
font-size:12px;
font-weight:600;
margin-top:6px;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis;
}

.movie-year{
font-size:10px;
color:#777;
margin-top:2px;
}


/* ================= GRID ================= */

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px 9px;
padding:15px;
}

.grid .movie-card{
width:100%;
}

.grid .poster{
width:100%;
height:auto;
aspect-ratio:2/3;
}


/* ================= LOADING ================= */

.loading{
padding:45px 20px;
text-align:center;
color:#888;
}

.spinner{
width:32px;
height:32px;
border:3px solid #292929;
border-top-color:#e50914;
border-radius:50%;
animation:spin .7s linear infinite;
margin:0 auto 12px;
}

@keyframes spin{
to{
transform:rotate(360deg);
}
}


/* ================= BOTTOM NAV ================= */

.bottom-nav{
position:fixed;
z-index:3000;
left:0;
right:0;
bottom:0;
height:65px;
display:flex;
justify-content:space-around;
align-items:center;
background:rgba(7,7,7,.97);
backdrop-filter:blur(18px);
border-top:1px solid #222;
}

.nav-button{
background:none;
border:0;
color:#777;
font-size:10px;
display:flex;
flex-direction:column;
align-items:center;
gap:4px;
}

.nav-button span{
font-size:20px;
}

.nav-button.active{
color:#fff;
}

.nav-button.active span{
color:#e50914;
}


/* ================= DETAILS ================= */

.details-modal{
position:fixed;
z-index:5000;
inset:0;
background:#050505;
display:none;
overflow-y:auto;
}

.details-modal.show{
display:block;
animation:fadeIn .25s ease;
}

@keyframes fadeIn{
from{
opacity:0;
}
to{
opacity:1;
}
}

.close-button{
position:fixed;
right:14px;
top:12px;
z-index:6000;
width:40px;
height:40px;
border-radius:50%;
border:1px solid #555;
background:rgba(0,0,0,.7);
color:white;
font-size:23px;
}

.details-backdrop{
height:250px;
position:relative;
overflow:hidden;
}

.details-backdrop img{
width:100%;
height:100%;
object-fit:cover;
opacity:.5;
filter:blur(1px);
}

.details-backdrop:after{
content:"";
position:absolute;
inset:0;
background:
linear-gradient(to bottom,transparent 20%,#050505 100%);
}

.details-main{
position:relative;
z-index:10;
display:flex;
gap:14px;
padding:0 16px;
margin-top:-95px;
}

.details-poster{
width:145px;
height:218px;
border-radius:9px;
overflow:hidden;
background:#151515;
flex-shrink:0;
box-shadow:0 12px 35px #000;
}

.details-poster img{
width:100%;
height:100%;
object-fit:cover;
}

.details-info{
padding-top:62px;
}

.details-title{
font-size:22px;
font-weight:900;
line-height:27px;
}

.details-meta{
font-size:11px;
color:#999;
line-height:17px;
margin-top:6px;
}

.details-rating{
font-size:13px;
color:#ffd700;
font-weight:bold;
margin-top:9px;
}

.details-actions{
display:flex;
flex-wrap:wrap;
gap:7px;
margin-top:11px;
}

.action{
border:0;
border-radius:6px;
padding:8px 11px;
font-size:11px;
font-weight:bold;
}

.favorite-button{
background:#292929;
color:#fff;
}

.imdb-button,
.watch-button{
background:#e50914;
color:#fff;
}

.details-body{
padding:20px 16px 90px;
}

.details-heading{
font-size:17px;
font-weight:800;
margin:20px 0 9px;
}

.overview{
font-size:13px;
line-height:21px;
color:#ccc;
}

.info-box{
background:#151515;
border-radius:8px;
padding:14px;
font-size:12px;
line-height:20px;
color:#bbb;
}

.info-box strong{
color:#fff;
}

.watch-link{
display:inline-block;
margin-top:11px;
background:#e50914;
color:#fff;
text-decoration:none;
padding:9px 13px;
border-radius:6px;
font-size:11px;
font-weight:bold;
}

.review{
background:#151515;
border-radius:8px;
padding:13px;
margin-bottom:9px;
}

.review-author{
font-size:12px;
font-weight:bold;
margin-bottom:7px;
}

.review-content{
font-size:11px;
line-height:18px;
color:#aaa;
}


/* ================= TMDB ================= */

.tmdb{
text-align:center;
color:#666;
font-size:9px;
line-height:15px;
padding:25px 15px;
}


/* ================= DESKTOP ================= */

@media(min-width:700px){

.header{
padding:0 30px;
}

.hero{
height:430px;
}

.hero-card{
width:245px;
height:360px;
}

.movie-card{
flex-basis:155px;
}

.poster{
width:155px;
height:225px;
}

.grid{
grid-template-columns:repeat(6,1fr);
}

.bottom-nav{
width:600px;
left:50%;
right:auto;
transform:translateX(-50%);
border-radius:15px 15px 0 0;
}

}

</style>
</head>

<script>


/* =====================================================
   ONLY CHANGE THIS LINE
   ===================================================== */

const API_KEY = "b28b49facbe85228205dcbec20a1c8a1";


/* =====================================================
   SETTINGS
   ===================================================== */

const API_URL =
"https://api.themoviedb.org/3";

const POSTER =
"https://image.tmdb.org/t/p/w500";

const BACKDROP =
"https://image.tmdb.org/t/p/w1280";


let heroMovies = [];

let heroIndex = 0;

let heroTimer = null;


let favorites =
JSON.parse(
localStorage.getItem("MHD_FAVORITES") || "[]"
);


/* =====================================================
   TMDB REQUEST
   ===================================================== */

async function tmdb(endpoint){

const separator =
endpoint.includes("?")
? "&"
: "?";


const url =
API_URL +
endpoint +
separator +
"api_key=" +
encodeURIComponent(API_KEY);


const response =
await fetch(url);


if(!response.ok){

throw new Error(
"TMDB request failed"
);

}


return await response.json();

}


/* =====================================================
   SAFE TEXT
   ===================================================== */

function safe(text){

return String(text || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


/* =====================================================
   MOVIE CARD
   ===================================================== */

function movieCard(movie){

if(!movie){
return "";
}


const title =
movie.title ||
movie.original_title ||
"Unknown Movie";


const image =
movie.poster_path
?
POSTER + movie.poster_path
:
"";


const rating =
Number(
movie.vote_average || 0
).toFixed(1);


const year =
movie.release_date
?
movie.release_date.substring(0,4)
:
"";


return `

<div
class="movie-card"
onclick="openDetails(${movie.id})">

<div class="poster">

${
image
?
`
<img
src="${image}"
alt="${safe(title)}"
loading="lazy">
`
:
`
<div style="
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#666;
font-size:11px;">
No Poster
</div>
`
}


<div class="rating">
★ ${rating}
</div>

</div>


<div class="movie-name">
${safe(title)}
</div>


<div class="movie-year">
${year}
</div>

</div>

`;

}


/* =====================================================
   SECTION
   ===================================================== */

function makeSection(title,movies){

if(!movies || !movies.length){
return "";
}


return `

<section class="section">

<div class="section-header">

<div class="section-title">
${safe(title)}
</div>

<div class="section-more">
Swipe →
</div>

</div>


<div class="movie-row">

${movies
.slice(0,18)
.map(movieCard)
.join("")}

</div>

</section>

`;

}


/* =====================================================
   HOME
   ===================================================== */

async function loadHome(){

const loader =
document.getElementById(
"homeLoading"
);

const content =
document.getElementById(
"homeContent"
);


try{


const [

trending,
hollywood,
bollywood,
bengali,
telugu,
tamil,
malayalam,
kannada,
indian,
topIndian,
topHollywood

] = await Promise.all([


/* TRENDING */

tmdb(
"/trending/movie/day"
),


/* HOLLYWOOD */

tmdb(
"/discover/movie" +
"?with_origin_country=US" +
"&sort_by=popularity.desc" +
"&vote_count.gte=20" +
"&page=1"
),


/* BOLLYWOOD */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=hi" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* BENGALI */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=bn" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TELUGU */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=te" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TAMIL */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=ta" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* MALAYALAM */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=ml" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* KANNADA */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&with_original_language=kn" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* INDIAN TRENDING */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&sort_by=popularity.desc" +
"&page=1"
),


/* TOP INDIAN */

tmdb(
"/discover/movie" +
"?with_origin_country=IN" +
"&sort_by=vote_average.desc" +
"&vote_count.gte=100" +
"&page=1"
),


/* TOP HOLLYWOOD */

tmdb(
"/discover/movie" +
"?with_origin_country=US" +
"&sort_by=vote_average.desc" +
"&vote_count.gte=300" +
"&page=1"
)

]);


const t =
trending.results || [];


heroMovies =
t
.filter(movie=>movie.poster_path)
.slice(0,12);


renderHero();


document.getElementById(
"homeSections"
).innerHTML =


makeSection(
"🔥 Trending Movies",
trending.results
)


+

makeSection(
"🎬 Hollywood Trending Movies",
hollywood.results
)


+

makeSection(
"🇮🇳 Bollywood Trending Movies",
bollywood.results
)


+

makeSection(
"🟢 Bengali Movies",
bengali.results
)


+

makeSection(
"🎞️ Telugu / Tollywood",
telugu.results
)


+

makeSection(
"🎥 Tamil Movies",
tamil.results
)


+

makeSection(
"🎬 Malayalam Movies",
malayalam.results
)


+

makeSection(
"🎬 Kannada Movies",
kannada.results
)


+

makeSection(
"🇮🇳 Indian Today's Trending",
indian.results
)


+

makeSection(
"⭐ Top Rated Indian Movies",
topIndian.results
)


+

makeSection(
"⭐ Top Rated Hollywood Movies",
topHollywood.results
);


loader.style.display="none";

content.style.display="block";


startHero();


}catch(error){

/*
No error screen.
If TMDB is temporarily loading,
the loading animation simply remains.
*/

console.log(error);

}

}


/* =====================================================
   HERO
   ===================================================== */

function heroPosition(index){

const total =
heroMovies.length;


if(index===heroIndex)
return "center";


if(
index ===
(heroIndex-1+total)%total
)
return "left";


if(
index ===
(heroIndex+1)%total
)
return "right";


if(
index ===
(heroIndex-2+total)%total
)
return "far-left";


if(
index ===
(heroIndex+2)%total
)
return "far-right";


return "";

}


function renderHero(){

const stage =
document.getElementById(
"heroStage"
);

const background =
document.getElementById(
"heroBackground"
);

const title =
document.getElementById(
"heroTitle"
);

const meta =
document.getElementById(
"heroMeta"
);


if(!heroMovies.length)
return;


const movie =
heroMovies[heroIndex];


const backgroundImage =
movie.backdrop_path
?
BACKDROP + movie.backdrop_path
:
POSTER + movie.poster_path;


background.style.backgroundImage =
`url("${backgroundImage}")`;


title.textContent =
movie.title ||
movie.original_title;


meta.textContent =
"★ " +
Number(movie.vote_average || 0).toFixed(1) +
"  •  Trending";


stage.innerHTML =

heroMovies
.map(
(movie,index)=>`

<div
class="hero-card ${heroPosition(index)}"
onclick="openDetails(${movie.id})">

<img
src="${POSTER+movie.poster_path}"
alt="${safe(movie.title)}">

</div>

`
)
.join("");

}


function nextHero(){

if(!heroMovies.length)
return;


heroIndex =
(heroIndex+1) %
heroMovies.length;


renderHero();

}


function startHero(){

clearInterval(heroTimer);


if(heroMovies.length>1){

heroTimer =
setInterval(
nextHero,
3000
);

}

}


/* =====================================================
   NAVIGATION
   ===================================================== */

document
.querySelectorAll(".nav-button")
.forEach(button=>{

button.onclick=()=>{

const page =
button.dataset.page;

document
.querySelectorAll(".page")
.forEach(p=>{
p.classList.remove("active");
});


document
.getElementById(page)
.classList.add("active");


document
.querySelectorAll(".nav-button")
.forEach(b=>{
b.classList.toggle(
"active",
b===button
);
});


window.scrollTo(0,0);


if(page==="trendingPage"){
loadTrending();
