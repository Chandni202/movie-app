<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MHD - Movie Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  background:#070707;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  padding-bottom:75px;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ================= HEADER ================= */

.header{
  padding:15px 15px 8px;
  background:#070707;
}

.logo{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  margin-bottom:14px;
}

.logo .red{
  color:#e50914;
}

.search-box{
  width:100%;
  max-width:600px;
  height:45px;
  background:#191919;
  border:1px solid #333;
  border-radius:25px;
  padding:0 18px;
  color:#fff;
  outline:none;
  font-size:15px;
}

.search-box:focus{
  border-color:#777;
}

/* ================= FEATURED ================= */

.feature-area{
  padding:8px 12px 0;
}

.feature{
  position:relative;
  width:100%;
  height:32vh;
  min-height:235px;
  max-height:350px;
  overflow:hidden;
  border-radius:12px;
  background:#151515;
}

.feature-track{
  display:flex;
  width:100%;
  height:100%;
  transition:transform .8s ease;
}

.feature-item{
  position:relative;
  min-width:100%;
  height:100%;
  background-size:cover;
  background-position:center;
}

.feature-item:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.88),
      rgba(0,0,0,.18)
    ),
    linear-gradient(
      0deg,
      #070707 0%,
      transparent 55%
    );
}

.feature-text{
  position:absolute;
  left:18px;
  bottom:20px;
  z-index:2;
  width:62%;
}

.feature-title{
  font-size:23px;
  font-weight:800;
  margin-bottom:7px;
}

.feature-info{
  color:#ddd;
  font-size:12px;
}

.feature-dots{
  position:absolute;
  right:13px;
  bottom:15px;
  z-index:5;
  display:flex;
  gap:5px;
}

.feature-dot{
  width:6px;
  height:6px;
  background:#777;
  border-radius:50%;
}

.feature-dot.active{
  width:17px;
  background:#fff;
  border-radius:5px;
}

/* ================= CONTENT ================= */

.content{
  padding:3px 14px 30px;
}

.section{
  margin-top:24px;
}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:11px;
}

.section-title h2{
  font-size:18px;
  font-weight:800;
}

.section-title span{
  color:#777;
  font-size:20px;
}

.movie-row{
  display:flex;
  gap:10px;
  overflow-x:auto;
  padding-bottom:5px;
  scroll-behavior:smooth;
}

.movie-row::-webkit-scrollbar{
  display:none;
}

.movie{
  flex:0 0 120px;
  cursor:pointer;
  transition:.2s;
}

.movie:active{
  transform:scale(.96);
}

.movie-poster{
  width:120px;
  height:178px;
  object-fit:cover;
  border-radius:7px;
  display:block;
  background:#171717;
}

.movie-name{
  font-size:12px;
  font-weight:bold;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.movie-info{
  font-size:10px;
  color:#888;
  margin-top:3px;
}

.star{
  color:#ffc107;
}

/* ================= LOADING ================= */

.loading{
  text-align:center;
  padding:60px 20px;
  color:#999;
}

.loader{
  display:inline-block;
  width:35px;
  height:35px;
  border:4px solid #333;
  border-top-color:#e50914;
  border-radius:50%;
  animation:rotate .8s linear infinite;
  margin-bottom:12px;
}

@keyframes rotate{
  to{
    transform:rotate(360deg);
  }
}

.error{
  margin:20px 5px;
  padding:18px;
  background:#171717;
  border:1px solid #7b1111;
  border-radius:8px;
  color:#ff7777;
  line-height:1.6;
  font-size:13px;
}

.empty{
  padding:50px 15px;
  text-align:center;
  color:#777;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:100;
  left:0;
  right:0;
  bottom:0;
  height:68px;
  background:rgba(12,12,12,.98);
  border-top:1px solid #282828;
  display:flex;
  justify-content:space-around;
  align-items:center;
}

.nav{
  background:none;
  border:none;
  color:#777;
  font-size:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
}

.nav-icon{
  font-size:21px;
}

.nav.active{
  color:#fff;
}

.nav.active .nav-icon{
  color:#e50914;
}

/* ================= DETAILS ================= */

.details-modal{
  position:fixed;
  z-index:500;
  inset:0;
  background:#090909;
  overflow-y:auto;
  display:none;
}

.details-modal.open{
  display:block;
}

.details-page{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#0c0c0c;
}

.close-button{
  position:absolute;
  top:14px;
  right:14px;
  z-index:10;
  width:38px;
  height:38px;
  border:none;
  border-radius:50%;
  background:rgba(0,0,0,.75);
  color:white;
  font-size:22px;
}

.details-backdrop{
  height:290px;
  width:100%;
  background-size:cover;
  background-position:center;
  position:relative;
}

.details-backdrop:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      to bottom,
      transparent 30%,
      #0c0c0c 100%
    );
}

.details-content{
  position:relative;
  margin-top:-75px;
  z-index:2;
  padding:0 17px 35px;
}

.poster-info{
  display:flex;
  gap:14px;
}

.big-poster{
  width:135px;
  height:200px;
  object-fit:cover;
  border-radius:8px;
  background:#181818;
}

.details-title{
  font-size:23px;
  font-weight:900;
  margin-top:8px;
  line-height:1.15;
}

.details-meta{
  color:#aaa;
  font-size:12px;
  line-height:1.8;
  margin-top:8px;
}

.details-rating{
  color:#ffc107;
  font-size:14px;
  margin-top:6px;
}

.description{
  margin-top:18px;
  color:#ccc;
  font-size:13px;
  line-height:1.65;
}

.action-row{
  display:flex;
  gap:8px;
  margin-top:16px;
  flex-wrap:wrap;
}

.action-button{
  border:none;
  border-radius:7px;
  padding:12px 15px;
  font-weight:bold;
}

.watch-button{
  background:#fff;
  color:#000;
}

.favorite-button{
  background:#e50914;
  color:#fff;
}

.watch-section{
  margin-top:25px;
}

.watch-section h3{
  font-size:17px;
  margin-bottom:10px;
}

.provider{
  display:inline-block;
  background:#181818;
  border:1px solid #333;
  border-radius:7px;
  padding:9px 11px;
  margin:3px;
  font-size:12px;
}

.review-box{
  margin-top:22px;
  background:#151515;
  border-radius:8px;
  padding:15px;
  color:#bbb;
  font-size:12px;
  line-height:1.6;
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .content{
    max-width:1200px;
    margin:auto;
  }

  .feature-area{
    max-width:1200px;
    margin:auto;
  }

  .movie{
    flex-basis:145px;
  }

  .movie-poster{
    width:145px;
    height:215px;
  }

  .feature{
    height:340px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="header">

  <div class="logo">
    MOVIE <span class="red">HUB</span>
  </div>

  <input
    id="searchInput"
    class="search-box"
    type="text"
    placeholder="Search movies..."
    autocomplete="off"
  >

</header>


<!-- ================= FEATURED ================= -->

<section class="feature-area">

  <div class="feature">

    <div
      id="featureTrack"
      class="feature-track">
    </div>

    <div
      id="featureDots"
      class="feature-dots">
    </div>

  </div>

</section>


<!-- ================= MOVIES ================= -->

<main
  id="content"
  class="content">

  <div class="loading">

    <div class="loader"></div>

    <br>

    Loading movies...

  </div>

</main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom-nav">

  <button
    id="homeButton"
    class="nav active"
    onclick="showHome()">

    <span class="nav-icon">⌂</span>
    Home

  </button>


  <button
    id="searchButton"
    class="nav"
    onclick="openSearch()">

    <span class="nav-icon">⌕</span>
    Search

  </button>


  <button
    id="trendingButton"
    class="nav"
    onclick="showTrending()">

    <span class="nav-icon">🔥</span>
    Trending

  </button>


  <button
    id="favoriteButton"
    class="nav"
    onclick="showFavorites()">

    <span class="nav-icon">♥</span>
    Your Favorites

  </button>

</nav>


<!-- ================= DETAILS MODAL ================= -->

<div
  id="detailsModal"
  class="details-modal">

  <div class="details-page">

    <button
      class="close-button"
      onclick="closeDetails()">

      ×

    </button>


    <div
      id="detailsBackdrop"
      class="details-backdrop">
    </div>


    <div class="details-content">

      <div class="poster-info">

        <img
          id="detailsPoster"
          class="big-poster"
          src=""
          alt=""
        >


        <div>

          <div
            id="detailsTitle"
            class="details-title">
          </div>


          <div
            id="detailsMeta"
            class="details-meta">
          </div>


          <div
            id="detailsRating"
            class="details-rating">
          </div>

        </div>

      </div>


      <div
        id="detailsDescription"
        class="description">
      </div>


      <div class="action-row">

        <button
          id="watchButton"
          class="action-button watch-button"
          style="display:none">

          ▶ WATCH NOW

        </button>


        <button
          id="favoriteMovieButton"
          class="action-button favorite-button">

          ♥ ADD TO FAVORITES

        </button>

      </div>


      <div class="watch-section">

        <h3>
          Where to Watch in India
        </h3>

        <div
          id="providers">
        </div>

      </div>


      <div
        id="reviewBox"
        class="review-box">
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   IMPORTANT:
   এখানে তোমার আগের WORKING TMDB V3 API KEY বসাও
===================================================== */

const API_KEY = "b28b49facbe85228205dcbec20a1c8a1";


const TMDB =
  "https://api.themoviedb.org/3";

const POSTER =
  "https://image.tmdb.org/t/p/w500";

const BACKDROP =
  "https://image.tmdb.org/t/p/w1280";


let featuredMovies = [];

let currentSlide = 0;

let sliderTimer = null;

let favorites =
  JSON.parse(
    localStorage.getItem(
      "MHD_FAVORITES"
    ) || "[]"
  );


/* =====================================================
   API
===================================================== */

async function tmdb(path){

  const separator =
    path.includes("?")
    ? "&"
    : "?";


  const url =
    TMDB +
    path +
    separator +
    "api_key=" +
    encodeURIComponent(API_KEY);


  const response =
    await fetch(url);


  if(!response.ok){

    let message =
      "TMDB API request failed.";

    try{

      const data =
        await response.json();

      if(data.status_message){

        message =
          data.status_message;

      }

    }catch(e){}


    throw new Error(message);

  }


  return await response.json();

}


/* =====================================================
   HTML SAFE
===================================================== */

function safe(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,
    function(character){

      return {

        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"

      }[character];

    }
  );

}


/* =====================================================
   CHECK API KEY
===================================================== */

function validKey(){

  return (
    API_KEY &&
    API_KEY !== "YOUR_API_KEY_HERE" &&
    API_KEY.length > 10
  );

}


/* =====================================================
   MOVIE CARD
===================================================== */

function movieCard(movie){

  const poster =
    movie.poster_path

    ? POSTER +
      movie.poster_path

    :

      "https://via.placeholder.com/500x750/151515/777?text=No+Poster";


  const title =
    movie.title ||
    movie.name ||
    "Unknown Movie";


  const year =
    movie.release_date
    ? movie.release_date.substring(0,4)
    : "—";


  const rating =
    Number(
      movie.vote_average || 0
    ).toFixed(1);


  return `

    <div
      class="movie"
      onclick="openMovie(${movie.id})">

      <img
        class="movie-poster"
        src="${poster}"
        loading="lazy"
        alt="${safe(title)}"
      >

      <div class="movie-name">

        ${safe(title)}

      </div>

      <div class="movie-info">

        ${year}

        •

        <span class="star">

          ★ ${rating}

        </span>

      </div>

    </div>

  `;

}


/* =====================================================
   SECTION
===================================================== */

function makeSection(
  title,
  movies
){

  if(
    !movies ||
    !movies.length
  ){

    return "";

  }


  return `

    <section class="section">

      <div class="section-title">

        <h2>
          ${title}
        </h2>

        <span>›</span>

      </div>


      <div class="movie-row">

        ${movies
          .map(movieCard)
          .join("")}

      </div>

    </section>

  `;

}


/* =====================================================
   HOME
===================================================== */

async function loadHome(){

  setNav("homeButton");


  if(!validKey()){

    showError(
      "TMDB API Key বসানো হয়নি। " +
      "Code-এর উপরে YOUR_API_KEY_HERE-এর জায়গায় " +
      "তোমার আগের working TMDB V3 API Key বসাও।"
    );

    return;

  }


  showLoading();


  try{

    const results =
      await Promise.all([

        tmdb(
          "/trending/movie/week"
        ),

        tmdb(
          "/discover/movie" +
          "?with_original_language=en" +
          "&sort_by=popularity.desc" +
          "&page=1"
        ),

        tmdb(
          "/discover/movie" +
          "?with_original_language=hi" +
          "&region=IN" +
          "&sort_by=popularity.desc" +
          "&page=1"
        ),

        tmdb(
          "/discover/movie" +
          "?with_origin_country=IN" +
          "&region=IN" +
          "&sort_by=popularity.desc" +
          "&page=1"
        ),

        tmdb(
          "/discover/movie" +
          "?with_origin_country=IN" +
          "&region=IN" +
          "&sort_by=vote_average.desc" +
          "&vote_count.gte=200" +
          "&page=1"
        ),

        tmdb(
          "/movie/top_rated" +
          "?region=US&page=1"
        )

      ]);


    const trending =
      results[0].results || [];


    const hollywood =
      results[1].results || [];


    const bollywood =
      results[2].results || [];


    const indian =
      results[3].results || [];


    const indianTop =
      results[4].results || [];


    const hollywoodTop =
      results[5].results || [];


    featuredMovies =
      trending.slice(0,10);


    createFeatured();


    document.getElementById(
      "content"
    ).innerHTML =

      makeSection(
        "🔥 Trending Movies",
        trending
      ) +

      makeSection(
        "🎬 Hollywood Trending Movies",
        hollywood
      ) +

      makeSection(
        "🇮🇳 Bollywood Trending Movies",
        bollywood
      ) +

      makeSection(
        "🇮🇳 Indian Today's Trending Movies",
        indian
      ) +

      makeSection(
        "⭐ Top IMDb Rated Indian Movies",
        indianTop
      ) +

      makeSection(
        "🏆 Top IMDb Rated Hollywood Movies",
        hollywoodTop
      );


  }catch(error){

    showError(
      "Movie load হয়নি.<br><br>" +
      "<b>TMDB Error:</b> " +
      safe(error.message)
    );

  }

}


/* =====================================================
   FEATURED SLIDER
===================================================== */

function createFeatured(){

  const track =
    document.getElementById(
      "featureTrack"
    );


  const dots =
    document.getElementById(
      "featureDots"
    );


  clearInterval(
    sliderTimer
  );


  if(!featuredMovies.length){

    track.innerHTML = "";

    dots.innerHTML = "";

    return;

  }


  track.innerHTML =
    featuredMovies
      .map(
        function(movie){

          const image =
            movie.backdrop_path

            ? BACKDROP +
              movie.backdrop_path

            :

              movie.poster_path

              ? POSTER +
                movie.poster_path

              : "";


          return `

            <div
              class="feature-item"
              style="
                background-image:
                url('${image}')
              "
              onclick="
                openMovie(${movie.id})
              ">

              <div
                class="feature-text">

                <div
                  class="feature-title">

                  ${safe(movie.title)}

                </div>

                <div
                  class="feature-info">

                  ★
                  ${Number(
                    movie.vote_average || 0
                  ).toFixed(1)}

                  •

                  ${
                    movie.release_date
                    ? movie.release_date
                        .substring(0,4)
                    : ""
                  }

                </div>

              </div>

            </div>

          `;

        }
      )
      .join("");


  dots.innerHTML =
    featuredMovies
      .map(
        function(movie,index){

          return `

            <span
              class="
                feature-dot
                ${
                  index === 0
                  ? "active"
                  : ""
                }
              ">

            </span>

          `;

        }
      )
      .join("");


  currentSlide = 0;


  sliderTimer =
    setInterval(

      function(){

        currentSlide++;

        if(
          currentSlide >=
          featuredMovies.length
        ){

          currentSlide = 0;

        }


        track.style.transform =
          "translateX(-" +
          (
            currentSlide * 100
          ) +
          "%)";


        const allDots =
          document.querySelectorAll(
            ".feature-dot"
          );


        allDots.forEach(
          function(dot,index){

            dot.classList.toggle(
              "active",
              index === currentSlide
            );

          }
        );


      },

      3000

    );

}


/* =====================================================
   SEARCH
===================================================== */

let searchTimeout;


document
  .getElementById(
    "searchInput"
  )
  .addEventListener(
    "input",
    function(event){

      clearTimeout(
        searchTimeout
      );


      const query =
        event.target.value.trim();


      searchTimeout =
        setTimeout(
          function(){

            if(
              query.length < 2
            ){

              loadHome();

              return;

            }


            searchMovies(
              query
            );

          },
          400
        );

    }
  );


async function searchMovies(
  query
){

  setNav("searchButton");


  if(!validKey()){

    showError(
      "API Key বসানো হয়নি।"
    );

    return;

  }


  showLoading();


  try{

    const data =
      await tmdb(
        "/search/movie" +
        "?query=" +
        encodeURIComponent(
          query
        ) +
        "&include_adult=false" +
        "&page=1"
      );


    const movies =
      data.results || [];


    document.getElementById(
      "content"
    ).innerHTML =

      movies.length

      ?

        makeSection(
          "🔎 Search Results",
          movies
        )

      :

        `

          <div class="empty">

            No movies found.

          </div>

        `;


  }catch(error){

    showError(
      "Search failed.<br><br>" +
      safe(error.message)
    );

  }

}


/* ===================================================
