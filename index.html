<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#08090d">

<title>Movie Hub</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  background:#08090d;
  color:#fff;
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

/* ================= HEADER ================= */

.header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(8,9,13,.96);
  backdrop-filter:blur(14px);
  border-bottom:1px solid rgba(255,255,255,.06);
}

.header-inner{
  height:72px;
  display:flex;
  align-items:center;
  padding:0 18px;
  gap:16px;
}

.logo{
  font-size:25px;
  font-weight:800;
  letter-spacing:-1px;
  white-space:nowrap;
}

.logo span{
  color:#00e5ff;
}

/* hamburger */

.menu-btn{
  width:40px;
  height:40px;
  border:0;
  background:transparent;
  color:#fff;
  font-size:28px;
  cursor:pointer;
}

/* desktop links */

.top-links{
  display:none;
}

/* ================= SEARCH ================= */

.search-wrap{
  padding:8px 18px 15px;
}

.search-box{
  width:100%;
  max-width:720px;
  margin:auto;
  height:52px;
  background:#292c32;
  border-radius:16px;
  display:flex;
  align-items:center;
  padding:0 15px;
  border:1px solid rgba(255,255,255,.05);
}

.search-icon{
  font-size:25px;
  margin-right:10px;
  opacity:.75;
}

.search-box input{
  flex:1;
  height:100%;
  border:0;
  outline:none;
  background:transparent;
  color:#fff;
  font-size:17px;
}

.search-box input::placeholder{
  color:#9a9ca2;
}

.clear-search{
  border:0;
  background:#656870;
  color:#ddd;
  width:28px;
  height:28px;
  border-radius:50%;
  cursor:pointer;
  font-size:17px;
}

/* ================= MAIN ================= */

main{
  padding-bottom:100px;
}

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ================= HERO ================= */

.hero{
  position:relative;
  height:340px;
  margin:10px 12px 28px;
  border-radius:20px;
  overflow:hidden;
  background:#111;
}

.hero-bg{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  transition:background-image .5s ease;
}

.hero-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(90deg,
      rgba(0,0,0,.95) 0%,
      rgba(0,0,0,.65) 38%,
      rgba(0,0,0,.15) 75%,
      rgba(0,0,0,.45) 100%),
    linear-gradient(0deg,
      rgba(8,9,13,1) 0%,
      transparent 45%);
}

.hero-content{
  position:absolute;
  z-index:4;
  left:22px;
  bottom:25px;
  width:62%;
}

.hero-title{
  font-size:28px;
  font-weight:800;
  margin-bottom:8px;
}

.hero-meta{
  font-size:13px;
  color:#ddd;
  margin-bottom:10px;
}

.hero-overview{
  font-size:13px;
  color:#ddd;
  line-height:1.45;
  display:-webkit-box;
  -webkit-line-clamp:3;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

.hero-btn{
  margin-top:14px;
  border:0;
  border-radius:10px;
  padding:10px 18px;
  background:#fff;
  color:#000;
  font-weight:bold;
  cursor:pointer;
}

.hero-dots{
  position:absolute;
  z-index:10;
  right:18px;
  bottom:18px;
  display:flex;
  gap:5px;
}

.hero-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
}

.hero-dot.active{
  width:22px;
  border-radius:10px;
  background:#00e5ff;
}

/* ================= SECTION ================= */

.section{
  margin:0 0 30px;
}

.section-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:0 18px 12px;
}

.section-title{
  font-size:22px;
  font-weight:750;
}

.see-all{
  color:#aaa;
  font-size:14px;
  cursor:pointer;
}

/* ================= HORIZONTAL ROW ================= */

.movie-row{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 18px 8px;
  scrollbar-width:none;
}

.movie-row::-webkit-scrollbar{
  display:none;
}

/* ================= CARD ================= */

.movie-card{
  flex:0 0 145px;
  width:145px;
  cursor:pointer;
  position:relative;
}

.poster{
  width:145px;
  height:215px;
  object-fit:cover;
  border-radius:10px;
  display:block;
  background:#17191e;
}

.card-info{
  padding-top:8px;
}

.card-title{
  font-size:15px;
  line-height:1.25;
  color:#eee;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.card-rating{
  margin-top:5px;
  font-size:12px;
  color:#ffd75a;
}

.lang-tag{
  position:absolute;
  top:7px;
  right:7px;
  background:rgba(20,20,20,.85);
  padding:5px 7px;
  border-radius:7px;
  font-size:11px;
  color:#eee;
}

/* ================= SEARCH PAGE ================= */

.search-page-title{
  padding:15px 18px;
  font-size:24px;
}

.search-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:18px 12px;
  padding:0 18px;
}

.search-grid .movie-card{
  width:100%;
}

.search-grid .poster{
  width:100%;
  height:auto;
  aspect-ratio:2/3;
}

/* ================= FAVORITES ================= */

.empty{
  text-align:center;
  padding:80px 20px;
  color:#888;
}

.empty-icon{
  font-size:55px;
  margin-bottom:12px;
}

/* ================= DETAILS ================= */

.details{
  position:fixed;
  inset:0;
  z-index:3000;
  background:#08090d;
  overflow-y:auto;
  display:none;
}

.details.show{
  display:block;
}

.details-close{
  position:fixed;
  z-index:3100;
  top:15px;
  right:15px;
  width:42px;
  height:42px;
  border:0;
  border-radius:50%;
  background:rgba(0,0,0,.7);
  color:#fff;
  font-size:25px;
  cursor:pointer;
}

.details-backdrop{
  height:430px;
  position:relative;
  background-size:cover;
  background-position:center;
}

.details-backdrop::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(0deg,#08090d 0%,transparent 65%),
    linear-gradient(90deg,rgba(0,0,0,.65),transparent);
}

.details-content{
  position:relative;
  margin-top:-80px;
  z-index:5;
  padding:0 20px 110px;
}

.details-poster{
  width:130px;
  border-radius:12px;
  box-shadow:0 10px 35px #000;
}

.details-title{
  font-size:28px;
  margin-top:16px;
}

.details-meta{
  color:#aaa;
  margin:9px 0;
  font-size:14px;
}

.rating{
  color:#ffd34e;
  font-weight:bold;
}

.details-overview{
  color:#d1d1d1;
  line-height:1.65;
  font-size:15px;
  margin-top:15px;
}

.action-buttons{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin:20px 0;
}

.action-btn{
  border:0;
  border-radius:10px;
  padding:12px 16px;
  font-weight:bold;
  cursor:pointer;
  background:#20232a;
  color:#fff;
}

.action-btn.primary{
  background:#00e5a8;
  color:#00130e;
}

.action-btn.imdb{
  background:#f5c518;
  color:#000;
}

.providers{
  margin-top:25px;
}

.providers h3{
  margin-bottom:12px;
}

.provider-list{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.provider{
  background:#1c1e23;
  border-radius:10px;
  padding:10px 13px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
}

.review{
  background:#15171c;
  border-radius:12px;
  padding:14px;
  margin-top:10px;
}

.review-name{
  color:#fff;
  font-weight:bold;
  margin-bottom:7px;
}

.review-text{
  color:#aaa;
  font-size:13px;
  line-height:1.5;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav{
  position:fixed;
  z-index:2000;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  background:rgba(25,27,32,.96);
  backdrop-filter:blur(18px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  justify-content:space-around;
}

.nav-item{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:4px;
  color:#85878d;
  cursor:pointer;
  font-size:11px;
}

.nav-icon{
  font-size:23px;
}

.nav-item.active{
  color:#00e5a8;
}

/* ================= LOADER ================= */

.loader{
  position:fixed;
  inset:0;
  z-index:5000;
  background:#08090d;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  transition:.4s;
}

.loader.hide{
  opacity:0;
  pointer-events:none;
}

.loader-logo{
  font-size:30px;
  font-weight:900;
  margin-bottom:25px;
}

.loader-logo span{
  color:#00e5ff;
}

.spinner{
  width:38px;
  height:38px;
  border:3px solid #292c32;
  border-top-color:#00e5a8;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= TOAST ================= */

.toast{
  position:fixed;
  z-index:6000;
  left:50%;
  bottom:90px;
  transform:translateX(-50%) translateY(20px);
  background:#20232a;
  padding:12px 18px;
  border-radius:10px;
  opacity:0;
  pointer-events:none;
  transition:.3s;
  font-size:13px;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  .header-inner{
    max-width:1200px;
    margin:auto;
  }

  .search-wrap{
    max-width:1200px;
    margin:auto;
  }

  .hero{
    max-width:1180px;
    margin:15px auto 35px;
    height:430px;
  }

  .section{
    max-width:1200px;
    margin-left:auto;
    margin-right:auto;
  }

  .movie-card{
    flex-basis:170px;
    width:170px;
  }

  .poster{
    width:170px;
    height:255px;
  }

  .search-grid{
    grid-template-columns:repeat(5,1fr);
    max-width:1200px;
    margin:auto;
  }

  .bottom-nav{
    max-width:700px;
    left:50%;
    transform:translateX(-50%);
    border-radius:20px 20px 0 0;
  }
}
</style>
</head>

<script>

/* =========================================================
   MOVIE HUB
   ========================================================= */

/*
   IMPORTANT:

   Put your TMDB V3 API KEY inside the quotes below.

   Example:

   const API_KEY = "123456789xxxxxxxx";

   DO NOT put your API Read Access Token here.
*/

const API_KEY = "1cbd9c19c34f501673f10630a96bc220";


const IMG = "https://image.tmdb.org/t/p/w500";
const BACKDROP = "https://image.tmdb.org/t/p/w1280";

const API = "https://api.themoviedb.org/3";


/* =========================================================
   GLOBAL DATA
   ========================================================= */

let trendingMovies = [];
let heroMovies = [];
let currentHero = 0;
let heroTimer = null;

let currentMovie = null;

let favorites =
  JSON.parse(localStorage.getItem("MOVIE_HUB_FAVORITES") || "[]");


/* =========================================================
   TMDB REQUEST
   ========================================================= */

async function tmdb(endpoint){

  if(!API_KEY || API_KEY === "1cbd9c19c34f501673f10630a96bc220"){
    return null;
  }

  try{

    const separator = endpoint.includes("?") ? "&" : "?";

    const url =
      API +
      endpoint +
      separator +
      "api_key=" +
      encodeURIComponent(API_KEY);

    const controller = new AbortController();

    const timeout =
      setTimeout(() => controller.abort(),15000);

    const response =
      await fetch(url,{
        signal:controller.signal
      });

    clearTimeout(timeout);

    if(!response.ok){
      return null;
    }

    return await response.json();

  }catch(error){

    console.log("TMDB request:",error);

    return null;
  }
}


/* =========================================================
   MOVIE CARD
   ========================================================= */

function movieCard(movie){

  if(!movie){
    return "";
  }

  if(!movie.poster_path){
    return "";
  }

  const poster =
    IMG + movie.poster_path;

  const title =
    movie.title ||
    movie.name ||
    "Untitled";

  const rating =
    Number(movie.vote_average || 0).toFixed(1);

  const language =
    movie.original_language
      ? movie.original_language.toUpperCase()
      : "";

  return `

    <div
      class="movie-card"
      onclick="openMovie(${movie.id})"
    >

      <img
        class="poster"
        src="${poster}"
        alt="${escapeHtml(title)}"
        loading="lazy"
      >

      ${
        language
        ?
        `<div class="lang-tag">${language}</div>`
        :
        ""
      }

      <div class="card-info">

        <div class="card-title">
          ${escapeHtml(title)}
        </div>

        <div class="card-rating">
          ★ ${rating}
        </div>

      </div>

    </div>

  `;
}


/* =========================================================
   SECTION CREATOR
   ========================================================= */

function createSection(
  containerId,
  title,
  movies
){

  const container =
    document.getElementById(containerId);

  if(!container){
    return;
  }

  if(!movies || !movies.length){
    container.innerHTML = "";
    return;
  }

  container.innerHTML = `

    <section class="section">

      <div class="section-head">

        <div class="section-title">
          ${title}
        </div>

        <div
          class="see-all"
          onclick="showSection('${containerId}')"
        >
          All ›
        </div>

      </div>

      <div class="movie-row">

        ${
          movies
            .filter(m => m && m.poster_path)
            .map(movieCard)
            .join("")
        }

      </div>

    </section>

  `;
}


/* =========================================================
   LOAD HOME
   ========================================================= */

async function loadHome(){

  /*
     Every category loads separately.
     So if one TMDB request fails,
     the whole website will NOT become blank.
  */

  const requests = {

    trending:
      "/trending/movie/week",

    indianTop:
      "/discover/movie?with_origin_country=IN&sort_by=vote_average.desc&vote_count.gte=100&region=IN",

    bollywood:
      "/discover/movie?with_original_language=hi&with_origin_country=IN&sort_by=popularity.desc&region=IN",

    hollywood:
      "/discover/movie?with_origin_country=US&sort_by=popularity.desc&region=US",

    bengali:
      "/discover/movie?with_original_language=bn&sort_by=popularity.desc&region=IN",

    telugu:
      "/discover/movie?with_original_language=te&sort_by=popularity.desc&region=IN",

    tamil:
      "/discover/movie?with_original_language=ta&sort_by=popularity.desc&region=IN",

    malayalam:
      "/discover/movie?with_original_language=ml&sort_by=popularity.desc&region=IN",

    kannada:
      "/discover/movie?with_original_language=kn&sort_by=popularity.desc&region=IN"

  };


  const keys =
    Object.keys(requests);


  const results =
    await Promise.allSettled(
      keys.map(key => tmdb(requests[key]))
    );


  const data = {};


  results.forEach((result,index)=>{

    const key = keys[index];

    if(
      result.status === "fulfilled" &&
      result.value &&
      Array.isArray(result.value.results)
    ){

      data[key] =
        result.value.results;

    }else{

      data[key] = [];

    }

  });


  /* TRENDING */

  trendingMovies =
    data.trending || [];


  /*
     Hero uses 12 movies.
  */

  heroMovies =
    trendingMovies
      .filter(m => m.poster_path)
      .slice(0,12);


  if(heroMovies.length){

    setupHero();

  }


  /* SECTIONS */

  createSection(
    "trendingSection",
    "🔥 Trending Movies",
    trendingMovies
  );


  createSection(
    "indianTopSection",
    "🇮🇳 Top Indian Movies",
    data.indianTop
  );


  createSection(
    "bollywoodSection",
    "🎬 Bollywood",
    data.bollywood
  );


  createSection(
