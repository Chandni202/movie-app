<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOVIE HUB — MHD</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

:root{
  --bg:#080808;
  --card:#151515;
  --red:#e50914;
  --text:#fff;
  --muted:#999;
}

body{
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  overflow-x:hidden;
}

button,input{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* ================= HEADER ================= */

.top{
  padding:16px 16px 8px;
  position:sticky;
  top:0;
  z-index:50;
  background:linear-gradient(#080808 78%,transparent);
}

.brand{
  font-size:28px;
  font-weight:900;
  letter-spacing:-1px;
  margin-bottom:13px;
}

.brand b{
  color:var(--red);
}

.search{
  width:min(560px,72vw);
  height:45px;
  border:1px solid #333;
  background:#191919;
  border-radius:24px;
  color:#fff;
  padding:0 18px;
  outline:none;
  font-size:15px;
}

.search:focus{
  border-color:#777;
}

/* ================= FEATURED ================= */

.feature-wrap{
  padding:12px 12px 4px;
}

.feature{
  height:32vh;
  min-height:245px;
  max-height:350px;
  position:relative;
  overflow:hidden;
  border-radius:12px;
  background:#111;
}

.slides{
  height:100%;
  display:flex;
  transition:transform .8s ease;
}

.slide{
  min-width:100%;
  height:100%;
  position:relative;
  background-size:cover;
  background-position:center;
  cursor:pointer;
}

.slide:after{
  content:"";
  position:absolute;
  inset:0;
  background:
    linear-gradient(
      90deg,
      rgba(0,0,0,.85),
      rgba(0,0,0,.15) 70%
    ),
    linear-gradient(
      0deg,
      #080808,
      transparent 50%
    );
}

.slide-info{
  position:absolute;
  z-index:2;
  left:20px;
  bottom:20px;
  max-width:58%;
}

.slide-title{
  font-size:24px;
  font-weight:800;
  margin-bottom:7px;
}

.slide-meta{
  font-size:12px;
  color:#ddd;
}

.dots{
  position:absolute;
  right:14px;
  bottom:17px;
  z-index:4;
  display:flex;
  gap:5px;
}

.dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:#777;
}

.dot.on{
  background:#fff;
  width:17px;
  border-radius:5px;
}

/* ================= MAIN ================= */

main{
  padding:8px 14px 90px;
}

.section{
  margin-top:23px;
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:10px;
}

.section-head h2{
  font-size:18px;
}

.section-head span{
  font-size:11px;
  color:#888;
}

/* ================= MOVIE ROW ================= */

.row{
  display:flex;
  gap:10px;
  overflow-x:auto;
  scroll-snap-type:x mandatory;
  padding-bottom:6px;
}

.row::-webkit-scrollbar{
  display:none;
}

.card{
  flex:0 0 120px;
  scroll-snap-align:start;
  transition:.25s;
  cursor:pointer;
}

.card:hover{
  transform:translateY(-3px);
}

.poster{
  width:120px;
  height:178px;
  object-fit:cover;
  border-radius:7px;
  background:#1b1b1b;
  display:block;
}

.name{
  font-size:12px;
  font-weight:700;
  margin-top:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.meta{
  font-size:10px;
  color:#888;
  margin-top:3px;
}

.rating{
  color:#ffc107;
}

/* ================= BOTTOM NAV ================= */

.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:66px;
  background:rgba(13,13,13,.97);
  border-top:1px solid #282828;
  display:flex;
  justify-content:space-around;
  align-items:center;
  z-index:100;
}

.nav{
  background:none;
  border:0;
  color:#777;
  font-size:10px;
  display:flex;
  flex-direction:column;
  gap:4px;
  align-items:center;
}

.nav i{
  font-style:normal;
  font-size:21px;
}

.nav.active{
  color:#fff;
}

.nav.active i{
  color:var(--red);
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.92);
  z-index:200;
  display:none;
  overflow:auto;
}

.modal.show{
  display:block;
}

.modal-box{
  max-width:720px;
  margin:auto;
  min-height:100vh;
  background:#0e0e0e;
  position:relative;
}

.close{
  position:absolute;
  right:13px;
  top:13px;
  z-index:5;
  width:37px;
  height:37px;
  border:0;
  border-radius:50%;
  background:#111;
  color:#fff;
  font-size:22px;
}

.detail-hero{
  height:300px;
  background-size:cover;
  background-position:center;
  position:relative;
}

.detail-hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 30%,
    #0e0e0e
  );
}

.detail-body{
  position:relative;
  margin-top:-80px;
  padding:0 18px 35px;
  z-index:2;
}

.detail-flex{
  display:flex;
  gap:15px;
}

.detail-poster{
  width:135px;
  height:200px;
  object-fit:cover;
  border-radius:8px;
}

.detail-title{
  font-size:23px;
  font-weight:800;
  margin:10px 0 8px;
}

.detail-small{
  color:#aaa;
  font-size:12px;
  line-height:1.7;
}

.overview{
  clear:both;
  padding-top:18px;
  color:#ccc;
  font-size:13px;
  line-height:1.6;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
  flex-wrap:wrap;
}

.action{
  border:0;
  border-radius:6px;
  padding:11px 15px;
  font-weight:700;
}

.watch{
  background:#fff;
  color:#000;
}

.fav{
  background:var(--red);
  color:#fff;
}

.providers{
  margin-top:22px;
}

.providers h3{
  font-size:16px;
  margin-bottom:10px;
}

.provider{
  display:inline-block;
  background:#191919;
  border:1px solid #333;
  border-radius:6px;
  padding:9px;
  margin:3px;
  font-size:12px;
}

.review{
  margin-top:20px;
  background:#151515;
  border-radius:8px;
  padding:13px;
  color:#bbb;
  font-size:12px;
  line-height:1.5;
}

.empty{
  padding:50px 15px;
  text-align:center;
  color:#777;
}

.loading{
  padding:35px;
  text-align:center;
}

.spin{
  display:inline-block;
  width:30px;
  height:30px;
  border:3px solid #333;
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{
    transform:rotate(360deg);
  }
}

/* ================= DESKTOP ================= */

@media(min-width:700px){

  main{
    max-width:1200px;
    margin:auto;
  }

  .feature-wrap{
    max-width:1200px;
    margin:auto;
  }

  .card{
    flex-basis:145px;
  }

  .poster{
    width:145px;
    height:215px;
  }

  .feature{
    height:340px;
  }
}
</style>
</head>

<body>

<!-- ================= HEADER ================= -->

<header class="top">

  <div class="brand">
    MOVIE <b>HUB</b>
  </div>

  <input
    id="search"
    class="search"
    placeholder="Search movies..."
  >

</header>


<!-- ================= FEATURED MOVIES ================= -->

<section class="feature-wrap">

  <div class="feature">

    <div
      id="slides"
      class="slides">
    </div>

    <div
      id="dots"
      class="dots">
    </div>

  </div>

</section>


<!-- ================= CONTENT ================= -->

<main id="home"></main>


<!-- ================= BOTTOM NAV ================= -->

<nav class="bottom">

  <button
    class="nav active"
    id="homeNav"
    onclick="goHome()">

    <i>⌂</i>
    Home

  </button>


  <button
    class="nav"
    onclick="focusSearch()">

    <i>⌕</i>
    Search

  </button>


  <button
    class="nav"
    onclick="loadTrendingPage()">

    <i>🔥</i>
    Trending

  </button>


  <button
    class="nav"
    onclick="loadFavorites()">

    <i>♥</i>
    Your Favorites

  </button>

</nav>


<!-- ================= MOVIE DETAILS ================= -->

<div
  id="modal"
  class="modal">

  <div class="modal-box">

    <button
      class="close"
      onclick="closeMovie()">

      ×

    </button>


    <div
      id="detailHero"
      class="detail-hero">
    </div>


    <div class="detail-body">

      <div class="detail-flex">

        <img
          id="detailPoster"
          class="detail-poster"
        >


        <div>

          <div
            id="detailTitle"
            class="detail-title">
          </div>


          <div
            id="detailInfo"
            class="detail-small">
          </div>


          <div
            id="detailRating"
            class="detail-small">
          </div>

        </div>

      </div>


      <div
        id="overview"
        class="overview">
      </div>


      <div class="actions">

        <button
          id="watchBtn"
          class="action watch"
          style="display:none">

          ▶ WATCH NOW

        </button>


        <button
          id="favBtn"
          class="action fav">

          ♥ ADD TO FAVORITES

        </button>

      </div>


      <div class="providers">

        <h3>
          Where to Watch in India
        </h3>

        <div id="providers"></div>

      </div>


      <div
        id="review"
        class="review">
      </div>

    </div>

  </div>

</div>


<script>

/* =====================================================
   TMDB API KEY
   নিজের TMDB V3 API KEY এখানে বসাও
===================================================== */

const API_KEY="b28b49facbe85228205dcbec20a1c8a1";


const API=
  "https://api.themoviedb.org/3";

const IMG=
  "https://image.tmdb.org/t/p/w500";

const BIG=
  "https://image.tmdb.org/t/p/w1280";


let featureMovies=[];
let slideIndex=0;
let slideTimer;


/* =====================================================
   FAVORITES
===================================================== */

let favorites=
  JSON.parse(
    localStorage.getItem(
      "mhd_favorites"
    ) || "[]"
  );


/* =====================================================
   API FUNCTION
===================================================== */

async function api(path){

  const response=
    await fetch(
      API+
      path+
      (
        path.includes("?")
        ? "&"
        : "?"
      )+
      "api_key="+
      API_KEY
    );

  if(!response.ok){
    throw new Error(
      "TMDB API Error"
    );
  }

  return await response.json();
}


/* =====================================================
   ESCAPE TEXT
===================================================== */

function esc(text){

  return String(
    text || ""
  ).replace(
    /[&<>"']/g,
    function(x){

      return {
        "&":"&amp;",
        "<":"&lt;",
        ">":"&gt;",
        '"':"&quot;",
        "'":"&#039;"
      }[x];

    }
  );

}


/* =====================================================
   MOVIE CARD
===================================================== */

function card(movie){

  const poster=
    movie.poster_path
    ? IMG+movie.poster_path
    : "https://via.placeholder.com/500x750/151515/777?text=No+Poster";


  return `

    <article
      class="card"
      onclick="openMovie(${movie.id})">

      <img
        class="poster"
        loading="lazy"
        src="${poster}"
        alt="${esc(movie.title)}"
      >

      <div class="name">
        ${esc(movie.title || "Unknown")}
      </div>

      <div class="meta">

        ${
          movie.release_date
          ? movie.release_date.slice(0,4)
          : "—"
        }

        •

        <span class="rating">
          ★
          ${(movie.vote_average || 0).toFixed(1)}
        </span>

      </div>

    </article>

  `;
}


/* =====================================================
   SECTION
===================================================== */

function section(title,list){

  if(!list || !list.length){
    return "";
  }

  return `

    <section class="section">

      <div class="section-head">

        <h2>
          ${title}
        </h2>

        <span>
          ›
        </span>

      </div>


      <div class="row">

        ${list.map(card).join("")}

      </div>

    </section>

  `;

}


/* =====================================================
   HOME DATA
===================================================== */

async function homeData(){

  document.getElementById(
    "home"
  ).innerHTML=`

    <div class="loading">

      <span class="spin"></span>

    </div>

  `;


  try{

    const [

      trending,

      hollywood,

      bollywood,

      indian,

      topIndian,

      topHollywood

    ]=

    await Promise.all([

      api(
        "/trending/movie/week"
      ),

      api(
        "/discover/movie" +
        "?with_original_language=en" +
        "&sort_by=popularity.desc" +
        "&page=1"
      ),

      api(
        "/discover/movie" +
        "?with_original_language=hi" +
        "&region=IN" +
        "&sort_by=popularity.desc" +
        "&page=1"
      ),

      api(
        "/discover/movie" +
        "?with_origin_country=IN" +
        "&region=IN" +
        "&sort_by=popularity.desc" +
        "&page=1"
      ),

      api(
        "/discover/movie" +
        "?with_origin_country=IN" +
        "&region=IN" +
        "&sort_by=vote_average.desc" +
        "&vote_count.gte=200" +
        "&page=1"
      ),

      api(
        "/movie/top_rated" +
        "?region=US&page=1"
      )

    ]);


    featureMovies=
      trending.results.slice(
        0,
        12
      );


    buildSlider();


    document.getElementById(
      "home"
    ).innerHTML=

      section(
        "🔥 Trending Movies",
        trending.results
      )+

      section(
        "🎬 Hollywood Trending Movies",
        hollywood.results
      )+

      section(
        "🇮🇳 Bollywood Trending Movies",
        bollywood.results
      )+

      section(
        "🇮🇳 Indian Today's Trending Movies",
        indian.results
      )+

      section(
        "⭐ Top IMDb Rated Indian Movies",
        topIndian.results
      )+

      section(
        "🏆 Top IMDb Rated Hollywood Movies",
        topHollywood.results
      );


  }catch(error){

    document.getElementById(
      "home"
    ).innerHTML=`

      <div class="empty">

        Movies could not load.

        <br><br>

        Please check your
        TMDB API key.

      </div>

    `;

  }

}


/* =====================================================
   FEATURE SLIDER
===================================================== */

function buildSlider(){

  clearInterval(
    slideTimer
  );


  const slides=
    document.getElementById(
      "slides"
    );

  const dots=
    document.getElementById(
      "dots"
    );


  slides.innerHTML=
    featureMovies.map(
      function(movie){

        const background=
          movie.backdrop_path
          ? BIG+
            movie.backdrop_path
          : (
            movie.poster_path
            ? IMG+
              movie.poster_path
            : ""
          );


        return `

          <div

            class="slide"

            style="
              background-image:
              url('${background}')
            "

            onclick="
              openMovie(${movie.id})
            "

          >

            <div class="slide-info">

              <div class="slide-title">

                ${esc(movie.title)}

              </div>


              <div class="slide-meta">

                ★
                ${(movie.vote_average || 0)
                  .toFixed(1)}

                •

                ${
                  movie.release_date
                  ? movie.release_date.slice(0,4)
                  : ""
                }

              </div>

            </div>

          </div>

        `;

      }
    ).join("");


  dots.innerHTML=
    featureMovies.map(
      function(movie,index){

        return `

          <span
            class="dot
            ${index===0 ? "on" : ""}">
          </span>

        `;

      }
    ).join("");


  slideIndex=0;


  slideTimer=
    setInterval(

      function(){

        if(!featureMovies.length){
          return;
        }


        slideIndex=
          (
            slideIndex+1
          )
          %
          featureMovies.length;


        slides.style.transform=
          "translateX(-"+
          (slideIndex*100)+
          "%)";


        [
          ...dots.children
        ].forEach(
          function(dot,index){

            dot.classList.toggle(
              "on",
              index===slideIndex
            );

          }
        );

      },

      3000

    );

}


/* =====================================================
   SEARCH
===================================================== */

async function searchMovies(query){

  if(
    query.trim().length < 2
  ){

    goHome();

    return;

  }


  document.getElementById(
    "home"
  ).innerHTML=`

    <div class="loading">

      <span class="spin"></span>

    </div>

  `;


  try{

    const data=
      await api(
        "/search/movie" +
        "?query="+
        encodeURIComponent(query)+
        "&include_adult=false" +
        "&page=1"
      );


    document.getElementById(
      "home"
    ).innerHTML=

      section(
        "🔎 Search Results",
        data.results
      )

      ||

      `

        <div class="empty">

          No movies found.

        </div>

      `;


  }catch(error){

    document.getElementById(
      "home"
    ).innerHTML=

      `

        <div class="empty">

          Search failed.

        </div>

      `;

  }

}


let searchTimer;


document
  .getElementById("search")
  .addEventListener(
    "input",
    function(event){

      clearTimeout(
        searchTimer
      );


      searchTimer=
        setTimeout(
          function(){

            searchMovies(
              event.target.value
            );

          },
          400
        );

    }
  );


/* =====================================================
   MOVIE DETAILS
===================================================== */

async function openMovie(id){

  document
    .getElementById("modal")
    .classList.add("show");


  document
    .getElementById(
      "detailTitle"
    )
    .textContent=
      "Loading...";


  try{

    const [

      movie,

      providers

    ]=

    await Promise.all([

      api(
        "/movie/"+
        id+
        "?append_to_response=credits"
      ),

      api(
        "/movie/"+
        id+
        "/watch/providers"
      )

    ]);


    document
      .getElementById(
        "detailHero"
      )
      .style.backgroundImage=

      `url('${
        movie.backdrop_path
        ? BIG+
          movie.backdrop_path
        : ""
      }')`;


    document
      .getElementById(
        "detailPoster"
      )
      .src=

      movie.poster_path
      ? IMG+
        movie.poster_path
      : "";


    document
      .getElementById(
        "detailTitle"
      )
      .textContent=
        movie.title;


    document
      .getElementById(
        "detailInfo"
      )
      .innerHTML=

      `

        ${
          movie.release_date
          ? movie.release_date.slice(0,4)
          : "—"
        }

        •

        ${
          movie.runtime || "—"
        }

        min

        <br>

        ${
          movie.genres
          ? movie.genres
              .map(
                function(g){
                  return g.name;
                }
              )
              .join(", ")
          : ""
        }

      `;


    document
      .getElementById(
        "detailRating"
      )
      .innerHTML=

      `

        ★

        ${
          (movie.vote_average || 0)
          .toFixed(1)
        }

        / 10

      `;


    document
      .getElementById(
        "overview"
      )
      .textContent=

      movie.overview ||
      "No overview available.";


    /* WATCH PROVIDERS */

    const india=
      providers.results?.IN;


    const providerBox=
      document.getElementById(
        "providers"
      );


    const allProviders=[

      ...(india?.flatrate || []),

      ...(india?.free || []),

      ...(india?.ads || []),

      ...(india?.rent || []),

      ...(india?.buy || [])

    ];


    const unique=[];


    allProviders.forEach(
      function(provider){

        if(
          !unique.some(
            function(x){

              return (
                x.provider_id ===
                provider.provider_id
              );

            }
          )
        ){

          unique.push(
            prov
